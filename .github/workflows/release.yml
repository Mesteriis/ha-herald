name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend tooling
        run: npm ci
      - name: Validate frontend source and generated assets
        run: |
          npm run check
          npm run build:check
          npm run test:frontend
      - name: Package HACS repository
        run: zip -r herald-hacs.zip custom_components README.md CHANGELOG.md LICENSE hacs.json docs mkdocs.yml
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            herald-hacs.zip
            custom_components/herald/frontend/herald-card.js
            custom_components/herald/frontend/herald-card.js.gz
            README.md
            CHANGELOG.md
