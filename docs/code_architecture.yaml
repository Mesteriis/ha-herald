# Actual source files and local imports; not a runtime call graph.
herald_package:
  integration: custom_components/herald
  frontend_source: frontend/herald-card.js
  frontend_assets: custom_components/herald/frontend
  build: npm run build
  modules:
    __init__.py:
      imports: [const, coordinator, frontend_registry, services]
    actions.py:
      imports: [const]
    ai.py:
      imports: [characters, const, controls, models, translations]
    binary_sensor.py:
      imports: [const, controls, entity]
    button.py:
      imports: [const, controls, entity]
    channel_tts_hume.py:
      imports: [models]
    characters.py:
      imports: []
    config_flow.py:
      imports: [const, discovery, effective_config]
    configuration_check.py:
      imports: [const, controls, models, policy_rules]
    const.py:
      imports: []
    context_builder.py:
      imports: [const, controls, models, presence, request]
    control_entities.py:
      imports: [const, controls]
    controls.py:
      imports: [characters, const, effective_config, models, presence, translations]
    coordinator.py:
      imports: [__init__, actions, ai, characters, configuration_check, const, context_builder, control_entities, controls, decisions, discovery, flows, models, notification_policies, plugins, policy_editor, policy_rules, presence, queue, request, router, rule_options, translations]
    decisions.py:
      imports: []
    diagnostics.py:
      imports: [const]
    discovery.py:
      imports: []
    effective_config.py:
      imports: [__init__, const, models]
    entity.py:
      imports: [const]
    flows.py:
      imports: [const, models]
    frontend_registry.py:
      imports: [const]
    helpers.py:
      imports: []
    models.py:
      imports: [const]
    notification_policies.py:
      imports: [controls, models, policy_rules]
    number.py:
      imports: [const, controls, entity]
    plugins.py:
      imports: []
    policy_editor.py:
      imports: [notification_policies]
    policy_rules.py:
      imports: [models, presence]
    presence.py:
      imports: [const, controls, discovery, models, request]
    queue.py:
      imports: [const, coordinator, models]
    request.py:
      imports: []
    router.py:
      imports: [actions, ai, channel_tts_hume, const, controls, decisions, flows, models, policy_rules, presence]
    rule_options.py:
      imports: [models, policy_rules, presence]
    select.py:
      imports: [const, controls, entity]
    sensor.py:
      imports: [const, entity]
    services.py:
      imports: [const, policy_rules]
    switch.py:
      imports: [const, controls, entity]
    translations.py:
      imports: [const]
  unsupported_features:
    - durable_queue
    - correlation_engine
    - learning_engine
    - webhook_api
    - cluster_replication
    - scheduled_daily_digest
    - python_transport_plugin_api
